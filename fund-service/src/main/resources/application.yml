spring:
  application:
    name: fund-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:application.yml?group=${NACOS_GROUP:PAYMENT_GROUP}&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=${NACOS_GROUP:PAYMENT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:payment}
        group: ${NACOS_GROUP:PAYMENT_GROUP}
        metadata:
          environment: ${spring.profiles.active}
          version: ${APP_VERSION:0.1.0}
      config:
        namespace: ${NACOS_NAMESPACE:payment}
        group: ${NACOS_GROUP:PAYMENT_GROUP}
        file-extension: yml
  flyway:
    enabled: ${FUND_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:fund-replay-producer}
fund:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN:}
  payment-success:
    topic: ${FUND_PAYMENT_SUCCESS_TOPIC:PAYMENT_SUCCEEDED}
    consumer-group: ${FUND_PAYMENT_SUCCESS_CONSUMER_GROUP:fund-payment-success}
  refund-success:
    topic: ${FUND_REFUND_SUCCESS_TOPIC:REFUND_SUCCEEDED}
    consumer-group: ${FUND_REFUND_SUCCESS_CONSUMER_GROUP:fund-refund-success}
management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
