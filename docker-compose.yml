services:
  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: payment-rocketmq-broker
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: local-rocketmq-namesrv:9876
      JAVA_OPT_EXT: '-Xms256m -Xmx512m -Xmn128m'
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.2.0/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    networks: [local-dev-network]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: payment-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    networks: [local-dev-network]
networks:
  local-dev-network:
    external: true
volumes:
  rocketmq-store:
  minio-data:
