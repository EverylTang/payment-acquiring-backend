trade:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN:}
  routing:
    platform-base-url: ${PLATFORM_SERVICE_URL:http://127.0.0.1:8081}
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
  payment-success-event:
    signing-secret: ${PAYMENT_SUCCESS_EVENT_SIGNING_SECRET:}
  channel-callback:
    base-url: ${TRADE_CHANNEL_CALLBACK_BASE_URL:}
  outbox:
    batch-size: ${TRADE_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${TRADE_OUTBOX_MAX_ATTEMPTS:8}
    retry-base-seconds: ${TRADE_OUTBOX_RETRY_BASE_SECONDS:5}
    retry-max-seconds: ${TRADE_OUTBOX_RETRY_MAX_SECONDS:300}
    claim-timeout-seconds: ${TRADE_OUTBOX_CLAIM_TIMEOUT_SECONDS:60}
  merchant-notification:
    delivery-ms: ${TRADE_MERCHANT_NOTIFICATION_DELIVERY_MS:1000}
    max-attempts: ${TRADE_MERCHANT_NOTIFICATION_MAX_ATTEMPTS:8}
    retry-base-seconds: ${TRADE_MERCHANT_NOTIFICATION_RETRY_BASE_SECONDS:5}
    retry-max-seconds: ${TRADE_MERCHANT_NOTIFICATION_RETRY_MAX_SECONDS:300}
    max-retry-age-seconds: ${TRADE_MERCHANT_NOTIFICATION_MAX_RETRY_AGE_SECONDS:86400}
    claim-timeout-seconds: ${TRADE_MERCHANT_NOTIFICATION_CLAIM_TIMEOUT_SECONDS:60}
  order-expiration:
    sweep-ms: ${TRADE_ORDER_EXPIRATION_SWEEP_MS:5000}
    batch-size: ${TRADE_ORDER_EXPIRATION_BATCH_SIZE:100}
    min-validity-seconds: ${TRADE_ORDER_EXPIRATION_MIN_VALIDITY_SECONDS:60}
    max-validity-seconds: ${TRADE_ORDER_EXPIRATION_MAX_VALIDITY_SECONDS:86400}
  attempt:
    query:
      batch-size: ${TRADE_ATTEMPT_QUERY_BATCH_SIZE:50}
      max-count: ${TRADE_ATTEMPT_QUERY_MAX_COUNT:8}
      lock-seconds: ${TRADE_ATTEMPT_QUERY_LOCK_SECONDS:60}
      retry-base-seconds: ${TRADE_ATTEMPT_QUERY_RETRY_BASE_SECONDS:30}
      retry-max-seconds: ${TRADE_ATTEMPT_QUERY_RETRY_MAX_SECONDS:300}
  refund:
    execute-ms: ${TRADE_REFUND_EXECUTE_MS:5000}
    callback-timeout-seconds: ${TRADE_REFUND_CALLBACK_TIMEOUT_SECONDS:600}
spring:
  application:
    name: trade-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:application.yml?group=${NACOS_GROUP:PAYMENT_GROUP}&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=${NACOS_GROUP:PAYMENT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:payment}
        group: ${NACOS_GROUP:PAYMENT_GROUP}
        metadata:
          environment: ${spring.profiles.active}
          version: ${APP_VERSION:0.1.0}
      config:
        namespace: ${NACOS_NAMESPACE:payment}
        group: ${NACOS_GROUP:PAYMENT_GROUP}
        file-extension: yml
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:trade-producer}
management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
