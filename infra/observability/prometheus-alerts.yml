groups:
  - name: payment-acquiring
    rules:
      - alert: PaymentRefundDeadLettered
        expr: increase(payment_refund_dead_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "退款进入 DEAD 状态"
      - alert: FundRefundReversalLagging
        expr: increase(fund_refund_reversal_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "退款冲正事件处理滞后"
      - alert: ReconciliationDifferencesOpen
        expr: sum(increase(reconciliation_difference_open_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "存在未处理对账差异"
